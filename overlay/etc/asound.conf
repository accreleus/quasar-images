# Route ALSA's default PCM/CTL to PulseAudio (belt-and-braces).
#
# Quasar's node-agent injects PULSE_SERVER/PULSE_COOKIE/PULSE_SINK into app
# containers, so PulseAudio-aware clients already reach the host sink. Some
# clients (e.g. Steam's Chromium AudioService) open ALSA directly and would
# otherwise fall back to a non-existent hardware device. This config makes those
# ALSA-only clients transparently use Pulse, honouring PULSE_SERVER from the
# environment. `fallback` keeps a broken/absent Pulse from hard-erroring - it
# drops back to the raw ALSA default rather than failing to open the device.
pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA device routed to PulseAudio"
    }
}

ctl.!default {
    type pulse
    fallback "sysdefault"
}
