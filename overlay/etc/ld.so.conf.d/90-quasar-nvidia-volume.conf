# Additive search path for the 32-bit NVIDIA driver volume the node-agent
# bind-mounts (read-only) into GPU app containers at /opt/quasar/nvidia-lib32 on
# NVIDIA hosts (issue #375). This is separate from, and does not shadow,
# the 64-bit libs the nvidia-container-toolkit injects into the standard
# system paths (/usr/lib64 et al) — glibc's loader matches shared objects
# by ELF class, so a 64-bit search never resolves a 32-bit .so from here
# and vice versa. No driver libraries are baked into the image; this only
# tells ldconfig where to look if/when the volume is present.
/opt/quasar/nvidia-lib32
