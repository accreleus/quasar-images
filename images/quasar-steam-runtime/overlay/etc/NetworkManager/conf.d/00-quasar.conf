# NetworkManager inside a Quasar app container exists only so Steam's libnm
# client can be constructed (quasar-images#4) — it must never try to own the
# container's networking.
#
# no-auto-default=* stops NM from synthesising a "Wired connection N" DHCP
# profile for the ethernet device. Docker's bridge network assigns the address
# statically and runs no DHCP server, so an auto-activation attempt is at best
# noise and at worst flushes the address the container was given. NM still
# adopts the pre-configured device as an external connection, which is all
# Steam's SystemNetworkStore needs to see.
[main]
no-auto-default=*
# No systemd inside the container: resolv.conf is docker-managed and read-only.
dns=none
rc-manager=unmanaged

# Without a connectivity check NM reports the externally-managed bridge device
# as "connected (local only) / limited" even though egress works, and every
# NM-state-gated consumer believes the box is offline: the Plasma applet shows
# no network, Discover refuses to install, Steam waits for a network that is
# already there (quasar-images#4's second half). The GNOME endpoint is NM's own
# upstream default check target; a successful fetch flips the state to
# "connected full" (live-verified in-container 2026-08-14: limited -> full).
# fedoraproject.org's hotspot.txt is NOT usable here — its http->https redirect
# reads as a captive portal.
[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
interval=300

[logging]
level=INFO
domains=ALL
